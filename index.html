<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; manifest-src 'self'; worker-src 'self'; connect-src 'none'; font-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#a3101c">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inspección CI">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png">
<title>Inspección de equipos CI</title>
<style>
/* VOICE: herramienta de campo, clara y confiable, nada decorativo que estorbe con guantes o con sol.
   IDEA: la tarjeta de inspección que cuelga del equipo: rojo de seguridad, amarillo de advertencia, casillas firmes.
   PICTURE: íconos propios de cada equipo sobre un menú rojo con franja de riesgo.
   COLOUR and TYPE: blanco, tinta #17191d, rojo #c8102e dominante, amarillo #ffc20e acento; fuente del sistema, cifras tabulares.
   LAYOUT: una columna en el teléfono, rejilla de mosaicos en pantallas anchas, barra superior fija con estado de guardado. */
:root{color-scheme:light dark;
--bg:light-dark(#f3f1ee,#121315);--card:light-dark(#fff,#1d1f23);--ink:light-dark(#17191d,#eceae6);--mut:light-dark(#5d626b,#a3a7ae);
--line:light-dark(#e2ded8,#30333a);--red:#c8102e;--red2:#8e0c1a;--yel:#ffc20e;--ok:light-dark(#1d7a45,#4cc27f);--okb:light-dark(#e3f4ea,#15301f);
--bad:light-dark(#b3001b,#ff6b7d);--badb:light-dark(#fde4e7,#3a1519);--warnb:light-dark(#fff4d1,#3a2f0c);--tint:light-dark(#fbeceb,#2a1d1f);--field:light-dark(#faf9f7,#16171a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow-x:clip;min-height:100vh;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.hide{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right))}
/* Encabezado rojo */
.hero{background:linear-gradient(160deg,#d0162f 0%,#a3101c 55%,#7d0b16 100%);color:#fff;position:relative;padding:calc(env(safe-area-inset-top) + 18px) 0 30px;overflow:hidden}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:repeating-linear-gradient(-45deg,var(--yel) 0 14px,#17191d 14px 28px)}
.heroart{position:absolute;right:max(-30px,calc(50% - 600px));bottom:10px;width:min(480px,78%);height:auto;pointer-events:none}
.hero h1{max-width:15ch}.hero p{max-width:44ch}
.hero .wrap{position:relative;z-index:1}
.hero .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;opacity:.95}
.brand svg{width:30px;height:30px}
.hero h1{font-size:clamp(28px,6vw,46px);line-height:1.05;margin:22px 0 8px;text-wrap:balance;font-weight:800;letter-spacing:-.01em}
.hero p{margin:0;opacity:.88;max-width:60ch}
.ibtn{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:12px;min-height:44px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;font-weight:600}
.ibtn svg{width:20px;height:20px}
.chipline{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chipline span{background:rgba(0,0,0,.22);border-radius:99px;padding:4px 12px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
/* Mosaicos */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:22px 0}
@media(min-width:760px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:190px;box-shadow:0 1px 0 rgba(0,0,0,.03),0 8px 24px -16px rgba(80,10,10,.35);transition:transform .15s}
.tile:active{transform:scale(.98)}
.tile .ic{width:72px;height:72px;border-radius:20px;background:var(--tint);display:grid;place-items:center}
.tile .ic svg{width:56px;height:56px}
.tile b{font-size:17px;line-height:1.2}
.freq{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px;background:#17191d;color:#fff;line-height:1.3}
.badge.y{background:var(--yel);color:#17191d}
.due{font-size:13px;color:var(--mut);margin-top:auto}
.due.bad{color:var(--bad);font-weight:600}.due.okk{color:var(--ok)}
.tile.nfpa{background:linear-gradient(135deg,#1f3f73,#14294d);color:#fff;border:0}
.tile.nfpa .ic{background:rgba(255,255,255,.12)}.tile.nfpa .due{color:#cfdcf2}
.row3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:28px}
@media(min-width:760px){.row3{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mini{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;text-align:left;min-height:64px}
.mini svg{width:30px;height:30px;flex:none}
.mini small{display:block;color:var(--mut);font-size:13px}
/* Barra de módulo */
.bar{position:sticky;top:0;z-index:20;background:var(--red2);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 0 8px}
.bar .wrap{display:flex;align-items:center;gap:10px}
.bar h2{font-size:17px;margin:0;line-height:1.2;flex:1}
.bar h2 small{display:block;font-weight:500;opacity:.8;font-size:12px}
.savest{font-size:12px;opacity:.9;white-space:nowrap}
.prog{height:4px;background:rgba(255,255,255,.2)}.prog i{display:block;height:100%;background:var(--yel);width:0;transition:width .3s}
main.pg{padding-top:18px;padding-bottom:120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:18px;display:flex;align-items:center;gap:10px}
.card h3 .n{width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:14px;flex:none}
.mhead{display:flex;gap:14px;align-items:center}
.mhead .ic{width:64px;height:64px;border-radius:18px;background:var(--tint);display:grid;place-items:center;flex:none}.mhead .ic svg{width:50px;height:50px}
.mut{color:var(--mut)}.sm{font-size:13px}
/* Campos */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px 14px}
.f{display:flex;flex-direction:column;gap:5px}
.f>span{font-size:13px;font-weight:600;color:var(--mut);line-height:1.3}
.f>span em{color:var(--bad);font-style:normal}
.f.wide{grid-column:1/-1}
.f .h{font-size:12px;color:var(--mut);font-weight:400}
input,select,textarea{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:12px;background:var(--field);padding:10px 12px;font-size:16px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--red);outline:none;box-shadow:0 0 0 3px rgba(200,16,46,.15)}
select.isbad,input.isbad{border-color:var(--bad);background:var(--badb)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:44px;border:1.5px solid var(--line);background:var(--field);border-radius:12px;padding:6px 10px;font-size:14px;font-weight:600}
.seg button.on{background:#17191d;color:#fff;border-color:#17191d}
.seg button.on.good{background:var(--ok);border-color:var(--ok)}
.seg button.on.bad{background:var(--bad);border-color:var(--bad)}
.warn{background:var(--warnb);border-radius:10px;padding:6px 10px;font-size:13px}
.grp{grid-column:1/-1;font-weight:800;font-size:14px;border-top:1px dashed var(--line);padding-top:12px;margin-top:4px;color:var(--red)}
/* Tarjetas de equipo */
details.u{border:1.5px solid var(--line);border-radius:16px;margin-bottom:10px;background:var(--card)}
details.u>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;min-height:56px}
details.u>summary::-webkit-details-marker{display:none}
details.u>summary .t{flex:1;font-weight:700;line-height:1.25}
details.u>summary .t small{display:block;font-weight:500;color:var(--mut);font-size:13px}
details.u[open]>summary{border-bottom:1px solid var(--line)}
.ub{padding:14px}
.pill{font-size:12px;font-weight:700;border-radius:99px;padding:4px 10px;white-space:nowrap}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.bad{background:var(--badb);color:var(--bad)}.pill.inc{background:var(--line);color:var(--mut)}.pill.dr{background:var(--warnb);color:light-dark(#7a5a00,#ffd766)}
.uact{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:0 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.p{background:var(--red);border-color:var(--red);color:#fff}
.btn.k{background:#17191d;border-color:#17191d;color:#fff}
.btn.g{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{min-height:40px;font-size:14px;padding:0 12px}
.btn.d{color:var(--bad)}
.btn svg{width:18px;height:18px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.el{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.el .nm{grid-column:1/-1;font-weight:600;font-size:14px}
.el .ctl{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.1fr) 70px 78px minmax(0,1.4fr);gap:6px;align-items:center}
.el .req{font-size:12px;text-align:center;color:var(--mut);line-height:1.1}.el .req b{display:block;font-size:16px;color:var(--ink)}
.el input,.el select{min-height:42px;padding:6px 8px;font-size:15px}
.el .seg button{min-height:42px;padding:4px 6px}
.lg{width:100%;border-collapse:collapse;font-size:14px}
.lg th{text-align:left;font-size:12px;color:var(--mut);font-weight:700;padding:4px}
.lg td{padding:4px;vertical-align:middle}
.lg input{min-height:42px;padding:6px 8px}
.list .it{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--card);width:100%;text-align:left}
.list .it .t{flex:1;line-height:1.3}.list .it .t small{display:block;color:var(--mut);font-size:13px}
.datebox{width:52px;text-align:center;flex:none;border-radius:12px;background:var(--tint);padding:6px 0;line-height:1.1}
.datebox b{display:block;font-size:20px;color:var(--red)}.datebox span{font-size:11px;text-transform:uppercase;color:var(--mut)}
.find{margin:0;padding-left:18px}.find li{margin:4px 0}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.fotos figure{margin:0;position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--line)}
.fotos img{width:100%;height:100%;object-fit:cover}
.fotos button{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-weight:700}
.sig{width:100%;height:180px;border:1.5px dashed var(--mut);border-radius:14px;background:#fff;touch-action:none;display:block}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.foot .wrap{display:flex;gap:10px}.foot .btn{flex:1}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));z-index:20;border-radius:18px;min-height:56px;padding:0 22px;box-shadow:0 10px 30px -10px rgba(160,10,20,.6)}
/* Bloqueo */
.lock{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(170deg,#c8102e,#6e0913)}
.lockc{background:var(--card);border-radius:24px;padding:26px 22px;width:min(420px,100%);box-shadow:0 30px 80px -30px #000}
.lockc .lg2{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.lockc .lg2 svg{width:52px;height:52px}
.lockc h1{font-size:22px;line-height:1.15;margin:0}
.lockc p{color:var(--mut);font-size:14px}
.lockc .f{margin-bottom:12px}
.pinin{font-size:22px;letter-spacing:.3em;text-align:center}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:4px 0 10px}
.shield{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--mut);margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.shield svg{width:18px;height:18px;flex:none;margin-top:2px}
/* Diálogo y avisos */
.dlg{position:fixed;inset:0;z-index:50;background:rgba(10,10,12,.55);display:grid;place-items:end center;padding:0}
@media(min-width:640px){.dlg{place-items:center;padding:20px}}
.dlg>div{background:var(--card);width:min(560px,100%);max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:640px){.dlg>div{border-radius:22px}}
.dlg h3{margin:0 0 10px;font-size:19px}
.dlg .btns{margin-top:16px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#17191d;color:#fff;padding:10px 18px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw;box-shadow:0 10px 30px -10px #000}
.ribbon{background:var(--warnb);font-size:13px;padding:8px 14px;text-align:center}
.nf h4{margin:14px 0 4px;font-size:15px}
.nf ul{margin:4px 0 0;padding-left:20px}.nf li{margin:3px 0}
.sumbox{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.sumbox span{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}
.sumbox b{font-size:15px}
.search{margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:8px 0 16px}
@media(min-width:760px){.kpis{grid-template-columns:2fr repeat(4,minmax(0,1fr))}}
.kpi{background:var(--field);border:1px solid var(--line);border-radius:14px;padding:12px;position:relative;overflow:hidden}
.kpi b{display:block;font-size:26px;line-height:1.1}.kpi span{font-size:13px;color:var(--mut)}
.kpi.bad b{color:var(--bad)}.kpi.big{grid-column:1/-1}@media(min-width:760px){.kpi.big{grid-column:auto}}
.kpi.big b{font-size:40px;color:var(--red)}.kpi i{position:absolute;left:0;bottom:0;height:5px;background:var(--ok)}
.mx{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.mx table{border-collapse:collapse;width:100%;font-size:13px}
.mx th{font-size:11.5px;color:var(--mut);font-weight:700;padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);min-width:86px;line-height:1.2}
.mx th:first-child{text-align:left;min-width:120px;position:sticky;left:0;background:var(--card)}
.mx td{padding:5px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.mx td:first-child{text-align:left;position:sticky;left:0;background:var(--card);padding-left:10px}
.mx td small{display:block;color:var(--mut);font-size:11.5px}
.mi{display:block;margin:0 auto 4px;width:28px;height:28px}.mi svg{width:28px;height:28px}
.cel{border:0;border-radius:10px;padding:6px 4px;width:100%;min-height:48px;font-size:12px;line-height:1.2}
.cel b{display:block;font-size:12.5px}.cel small{color:inherit!important;opacity:.85}.cel[disabled]{cursor:default;opacity:.6}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12.5px;color:var(--mut)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;border:1.5px solid;vertical-align:-2px;margin-right:5px}
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 10px;margin-top:10px}
.chk label{display:flex;gap:8px;align-items:center;min-height:40px;font-size:14px}.chk input{width:20px;min-height:20px}
#print{display:none}
@media(max-width:420px){.tile{min-height:176px;padding:14px}.tile .ic{width:62px;height:62px}.tile .ic svg{width:48px;height:48px}.el .ctl{grid-template-columns:minmax(0,1fr) 58px 66px;}.el .ctl select{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
 body{background:#fff;color:#000}#root,.toast,.dlg{display:none!important}#print{display:block}
 #print table{width:100%;border-collapse:collapse;font-size:9.5pt;margin-bottom:8px;page-break-inside:auto}
 #print td{border:1px solid #888;padding:3px 5px;vertical-align:top}
 #print td.s1{border:0;font-size:13pt;font-weight:800}#print td.s0{border:0}
 #print td.s2{background:#e6e6e6;font-weight:700}#print td.s4{font-weight:700;text-decoration:underline}
 #print td.s5,#print td.s6{background:#f0f0f0;font-weight:700}#print td.s6{border:0}
 #print .pf{display:flex;gap:16px;align-items:flex-end;margin-top:8px}#print .pf img{height:70px;border-bottom:1px solid #000}
 #print .ph{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}#print .ph img{width:31%;border:1px solid #999}
 @page{size:landscape;margin:10mm}
}
</style>
</head>

<script>

'use strict';
/* ================= Utilidades ================= */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const te=new TextEncoder(),td=new TextDecoder();
const hex=b=>[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
const uid=()=>hex(crypto.getRandomValues(new Uint8Array(8)));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO=()=>iso(new Date());
const fmt=s=>s&&/^\d{4}-\d{2}(-\d{2})?$/.test(s)?s.split('-').reverse().join('/'):(s||'');
const addM=(s,m)=>{const [y,mo,d]=s.split('-').map(Number);return iso(new Date(y,mo-1+m,d))};
const yrs=(a,b)=>(new Date(b)-new Date(a))/31557600000;
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const EMBED=(()=>{try{return window.top!==window}catch(e){return true}})();
let EMBED_NOTE=EMBED;

/* ================= Cifrado (AES-256-GCM + PBKDF2) ================= */
const ITER=600000;
const b64=u=>{const b=new Uint8Array(u);let s='';for(let i=0;i<b.length;i+=32768)s+=String.fromCharCode.apply(null,b.subarray(i,i+32768));return btoa(s)};
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pass,salt,iter){
  const k=await crypto.subtle.importKey('raw',te.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function seal(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(obj)));return{iv:b64(iv),ct:b64(ct)}}
async function unseal(key,box){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(box.iv)},key,ub64(box.ct));return JSON.parse(td.decode(pt))}

/* ================= Almacenamiento local (IndexedDB) ================= */
const DB={db:null,mem:{meta:new Map(),recs:new Map(),cons:new Map()},
  async init(){try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open('inspeccion-ci',2);r.onupgradeneeded=()=>{const d=r.result;for(const n of ['meta','recs','cons'])if(!d.objectStoreNames.contains(n))d.createObjectStore(n)};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){this.db=null}},
  tx(st,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(st,mode),r=fn(t.objectStore(st));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  get(st,k){return this.db?this.tx(st,'readonly',s=>s.get(k)):Promise.resolve(this.mem[st].get(k))},
  put(st,k,v){return this.db?this.tx(st,'readwrite',s=>s.put(v,k)):Promise.resolve(this.mem[st].set(k,v))},
  del(st,k){return this.db?this.tx(st,'readwrite',s=>s.delete(k)):Promise.resolve(this.mem[st].delete(k))},
  all(st){return this.db?this.tx(st,'readonly',s=>s.getAll()):Promise.resolve([...this.mem[st].values()])},
  async wipe(){if(this.db){await this.tx('recs','readwrite',s=>s.clear());await this.tx('meta','readwrite',s=>s.clear());await this.tx('cons','readwrite',s=>s.clear())}else{this.mem.meta.clear();this.mem.recs.clear();this.mem.cons.clear()}}
};

function lockScreen(mode,msg=''){
  const setup=mode==='setup';
  root.innerHTML=`<div class="lock"><form class="lockc" id="lf" autocomplete="off">
   <div class="lg2">${IC.logo}<div><h1>Inspección de equipos y elementos CI</h1><span class="mut sm">Uso en campo, sin señal</span></div></div>
   ${setup?`<p>Cree un PIN o clave para proteger la información. Todo lo que registre queda cifrado en este dispositivo y nunca se envía por internet.</p>
   <div class="seg" id="kind" style="margin-bottom:12px"><button type="button" class="on" data-k="pin">PIN numérico</button><button type="button" data-k="pass">Clave alfanumérica</button></div>
   <label class="f"><span>Nuevo PIN (mínimo 6 dígitos)</span><input id="p1" type="password" class="pinin" inputmode="numeric" autocomplete="new-password" required></label>
   <label class="f"><span>Confirmar</span><input id="p2" type="password" class="pinin" inputmode="numeric" autocomplete="new-password" required></label>`
   :`<p>Ingrese su ${S.kind==='pin'?'PIN':'clave'} para desbloquear.</p><label class="f"><span>${S.kind==='pin'?'PIN':'Clave'}</span><input id="p1" type="password" class="pinin" ${S.kind==='pin'?'inputmode="numeric"':''} autocomplete="current-password" required></label>`}
   <div class="err" id="er" role="alert">${esc(msg)}</div>
   <button class="btn p" style="width:100%" id="go">${setup?'Crear y entrar':'Desbloquear'}</button>
   <div class="shield">${IC.sh}<span>Cifrado AES-256-GCM con clave derivada PBKDF2-SHA256 (600.000 iteraciones). La app no tiene conexión a internet ni servidores; si olvida el ${setup?'PIN':'PIN o clave'} los datos no se pueden recuperar.</span></div>
   ${setup?'':`<button type="button" class="btn sm d" id="forgot" style="margin-top:10px">Olvidé el PIN: borrar todo y empezar</button>`}
  </form></div>`;
  let kind='pin';
  const kb=$('#kind');if(kb)kb.onclick=e=>{const b=e.target.closest('button');if(!b)return;kind=b.dataset.k;$$('button',kb).forEach(x=>x.classList.toggle('on',x===b));
    $$('#p1,#p2').forEach(i=>{i.inputMode=kind==='pin'?'numeric':'text';i.classList.toggle('pinin',kind==='pin')});$('#lf span').textContent=kind==='pin'?'Nuevo PIN (mínimo 6 dígitos)':'Nueva clave (mínimo 8 caracteres)'};
  const fg=$('#forgot');if(fg)fg.onclick=async()=>{const r=await dialog(`<h3>Borrar todos los datos</h3><p>Sin el PIN no es posible descifrar la información. Esto elimina permanentemente todas las inspecciones de este dispositivo. Escriba <b>BORRAR</b> para confirmar.</p><input name="c" autocomplete="off">`,[{t:'Cancelar'},{t:'Borrar todo',c:'p',v:1}]);if(r&&r.vals.c==='BORRAR'){await DB.wipe();location.hash='';lockScreen('setup')}};
  $('#lf').onsubmit=async e=>{e.preventDefault();const er=$('#er'),p1=$('#p1').value;
    if(!window.crypto||!crypto.subtle){er.textContent='Este navegador no permite cifrado seguro. Abra la app instalada o en un navegador actualizado.';return}
    $('#go').disabled=true;$('#go').textContent='Verificando…';
    try{
     if(setup){const p2=$('#p2').value;
      if(kind==='pin'&&!/^\d{6,}$/.test(p1))throw new Error('El PIN debe tener al menos 6 dígitos.');
      if(kind==='pass'&&p1.length<8)throw new Error('La clave debe tener al menos 8 caracteres.');
      if(/^(\d)\1+$/.test(p1)||'0123456789'.includes(p1)||'9876543210'.includes(p1))throw new Error('Evite PIN repetidos o consecutivos.');
      if(p1!==p2)throw new Error('Los valores no coinciden.');
      const salt=crypto.getRandomValues(new Uint8Array(16));S.key=await derive(p1,salt,ITER);
      await DB.put('meta','auth',{v:1,salt:b64(salt),iter:ITER,kind,check:await seal(S.key,{ok:'inspeccion-ci'})});S.kind=kind;
      try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(x){}
      await saveCfg();start();
     }else{
      const f=(await DB.get('meta','fails'))||{n:0,until:0};
      if(Date.now()<f.until)throw new Error('Demasiados intentos. Espere '+Math.ceil((f.until-Date.now())/1000)+' s.');
      const a=await DB.get('meta','auth');const k=await derive(p1,ub64(a.salt),a.iter);
      try{await unseal(k,a.check)}catch(x){f.n++;f.until=f.n>=3?Date.now()+Math.min(900,15*2**(f.n-3))*1000:0;await DB.put('meta','fails',f);throw new Error('PIN o clave incorrectos ('+f.n+' intento'+(f.n>1?'s':'')+').')}
      await DB.put('meta','fails',{n:0,until:0});S.key=k;
      for(const b of await DB.all('recs')){try{const r=await unseal(k,b);S.recs.set(r.id,r)}catch(x){}}
      const c=await DB.get('meta','cfg');if(c){try{Object.assign(S.cfg,await unseal(k,c))}catch(x){}}
      const iv=await DB.get('meta','inv');if(iv){try{S.inv=await unseal(k,iv)||{}}catch(x){}}
      const pv=await DB.get('meta','prog');if(pv){try{S.prog=await unseal(k,pv)||{stations:[]}}catch(x){}}
      for(const b of await DB.all('cons')){try{const r=await unseal(k,b);S.cons.set(r.id,r)}catch(x){}}
      start();
     }
    }catch(x){er.textContent=x.message;$('#go').disabled=false;$('#go').textContent=setup?'Crear y entrar':'Desbloquear'}
  };
  setTimeout(()=>{const i=$('#p1');i&&i.focus()},60);
}

function route(){
  const h=location.hash.slice(1);window.scrollTo(0,0);
  if(h.startsWith('m-')&&MODS[h.slice(2).replace(/-/g,'_')])return modView(h.slice(2).replace(/-/g,'_'));
  if(h.startsWith('e-')&&S.recs.get(h.slice(2)))return editor(S.recs.get(h.slice(2)));
  if(h.startsWith('n-')&&MODS[h.slice(2).replace(/-/g,'_')])return nfpaView(h.slice(2).replace(/-/g,'_'));
  if(h==='nfpa')return nfpaView();if(h==='inventario')return invView();if(h==='tablero')return S.cfg.coord?tabView():home();if(h==='historial')return histView();if(h==='seguridad')return secView();
  home();
}

/* ================= Vencimientos ================= */
function dueInfo(m){
  const def=MODS[m],last={};let draft=0;
  recsOf(m).forEach(r=>{if(r.status!=='final'){draft++;return}const k=(r.h.estacion||'').trim().toUpperCase();if(!last[k]||r.h.fecha>last[k])last[k]=r.h.fecha});
  const st=Object.entries(last).filter(([,f])=>f).map(([e,f])=>({e,next:addM(f,def.months)}));
  const t=todayISO(),over=st.filter(x=>x.next<t);
  if(over.length)return{c:'bad',t:`Vencida en ${over.length} estación${over.length>1?'es':''}`};
  if(st.length){const n=st.sort((a,b)=>a.next.localeCompare(b.next))[0];return{c:'okk',t:'Próxima: '+fmt(n.next)+(st.length>1?' ('+n.e+')':'')}}
  if(draft)return{c:'',t:draft+' borrador'+(draft>1?'es':'')+' en curso'};
  return{c:'',t:'Sin inspecciones registradas'};
}

function flat(def){return def.fields.filter(f=>f.k)}
function findings(def,r){const out=[];
  r.units.forEach((u,i)=>{const lb=def.ulabel(u,i);flat(def).forEach(f=>{
    if(f.t==='matrix'){(u.el||[]).forEach((x,j)=>{if(!x)return;const nm=GEL[j][0]==='Otro'?(x.n||'Otro'):GEL[j][0];const rq=reqOf(j,r.h.tipo);
      if(x.e&&BOP.includes(x.e))out.push({u:i,t:`${lb}: ${nm} → ${x.e}`});
      if(rq>0&&x.d==='NO')out.push({u:i,t:`${lb}: ${nm} no disponible (requerido ${rq})`});
      else if(rq>0&&x.c!==''&&x.c!=null&&+x.c<rq)out.push({u:i,t:`${lb}: ${nm} cantidad ${x.c} de ${rq} requeridas`})});return}
    const v=u[f.k];if(f.bad&&f.bad.includes(v))out.push({u:i,t:`${lb}: ${f.l} → ${v}`});
    if(f.chk){const w=f.chk(v,u,r);if(w)out.push({u:i,t:`${lb}: ${w}`,w:1})}})});
  (def.tail||[]).forEach(f=>{if(f.bad&&f.bad.includes(r.h[f.k]))out.push({u:-1,t:`${f.l} → ${r.h[f.k]}`})});
  if(def.grid){const t=(r.grid[def.grid.k]||[]).reduce((a,x)=>a+def.grid.calc(x),0);if(t>=1080)out.push({u:-1,t:`Cartucho del compresor con ${Math.round(t)} de 1200 minutos compensados: programar cambio`,w:1})}
  return out}
function unitState(def,u,i,r){const fs=flat(def).filter(f=>f.t==='sel'&&!f.keep||f.req);const empty=fs.filter(f=>!u[f.k]).length;const nb=findings(def,{...r,units:[u]}).length;
  return nb?`<span class="pill bad">${nb} hallazgo${nb>1?'s':''}</span>`:empty?`<span class="pill inc">${empty} pendiente${empty>1?'s':''}</span>`:`<span class="pill ok">Conforme</span>`}
function progress(def,r){let t=0,f=0;r.units.forEach(u=>flat(def).forEach(x=>{if(x.t==='sel'||x.req){t++;if(u[x.k])f++}}));['fecha','estacion','zona'].forEach(k=>{t++;if(r.h[k])f++});t+=3;if(r.insp.nombre)f++;if(r.insp.cargo)f++;if(r.firma)f++;return t?Math.round(f/t*100):0}

function tabData(zone){
  const today=todayISO(),soon=iso(new Date(Date.now()+15*864e5));const recs=allRecs().filter(r=>r.status==='final');
  const st=(S.prog.stations||[]).filter(s=>!zone||s.z===zone).sort((a,b)=>a.n.localeCompare(b.n));const cells=[];const att=[];const finds=[];const plans=[];
  const rep={};for(const r of S.cons.values()){const k=nk(r.h.estacion);if(!rep[k]||rep[k]<r._src.at)rep[k]=r._src.at}
  for(const r of S.recs.values()){if(MODS[r.mod]&&r.status==='final'){const k=nk(r.h.estacion);if(!rep[k]||rep[k]<r.updated)rep[k]=r.updated}}
  for(const s of st){for(const m of TMODS){if(!s.m.includes(m)){cells.push({s,m,c:'na'});continue}
      const last=recs.filter(r=>r.mod===m&&nk(r.h.estacion)===nk(s.n)).sort((a,b)=>(b.h.fecha||'').localeCompare(a.h.fecha||'')||b.updated-a.updated)[0];
      if(!last){cells.push({s,m,c:'sin'});att.push({s,m,t:'Sin registro',o:0});continue}
      const next=addM(last.h.fecha,MODS[m].months);const c=next<today?'venc':next<=soon?'prox':'ok';cells.push({s,m,c,r:last,next});
      if(c==='venc')att.push({s,m,t:'Vencida desde '+fmt(next),o:1});else if(c==='prox')att.push({s,m,t:'Vence el '+fmt(next),o:2});
      findings(MODS[m],last).forEach(f=>finds.push({s,m,r:last,t:f.t,w:f.w}));
      if(last.plan.req==='SI')last.plan.rows.forEach(p=>plans.push({s,m,r:last,p,v:p.fv&&p.fv<today}))}}
  const req=cells.filter(c=>c.c!=='na'),okc=req.filter(c=>c.c==='ok'||c.c==='prox').length;
  const sinRep=st.filter(s=>!rep[nk(s.n)]);
  return{st,cells,att:att.sort((a,b)=>a.o-b.o),finds,plans,req:req.length,okc,pct:req.length?Math.round(okc/req.length*100):0,rep,sinRep}}

    const r=await dialog(`<h3>Restaurar copia</h3><label class="f"><span>Clave de la copia</span><input name="a" type="password"></label>`,[{t:'Cancelar'},{t:'Restaurar',c:'p',v:1}]);if(!r)return;
    let d;try{d=await unseal(await derive(r.vals.a,ub64(j.salt),j.iter),j)}catch(x){return toast('Clave incorrecta')}
    let n=0;let ni=0;for(const[k2,e2]of Object.entries(d.inv||{})){if(e2&&MODS[e2.mod]&&(!S.inv[k2]||S.inv[k2].fecha<e2.fecha)){S.inv[k2]=e2;ni++}}if(ni)await saveInv();if(d.prog&&d.prog.stations&&d.prog.stations.length&&!(S.prog.stations||[]).length){S.prog=d.prog;await saveProg()}for(const rr of d.recs||[]){if(!rr||!rr.id||!MODS[rr.mod])continue;const cur=S.recs.get(rr.id);if(!cur||cur.updated<rr.updated){const u=rr.updated;await save(rr);rr.updated=u;n++}}toast(n+' registro(s) restaurados')};
  $('#wp').onclick=async()=>{const r=await dialog(`<h3>Borrar todos los datos</h3><p>Escriba <b>BORRAR</b> para confirmar.</p><input name="c" autocomplete="off">`,[{t:'Cancelar'},{t:'Borrar todo',c:'p',v:1}]);if(r&&r.vals.c==='BORRAR'){await DB.wipe();S.key=null;S.recs.clear();location.hash='';lockScreen('setup')}};
}

/* ================= Arranque ================= */
(async()=>{await DB.init();const a=await DB.get('meta','auth');if(a)S.kind=a.kind||'pin';lockScreen(a?'unlock':'setup',DB.db?'':'Aviso: este navegador no permite almacenamiento persistente; los datos se perderán al cerrar.');
  if('serviceWorker' in navigator&&location.protocol==='https:'&&!EMBED){try{navigator.serviceWorker.register('sw.js')}catch(x){}}})();
}
</script>
